{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Vendor Bulk Payment</h2>
    
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="vendor">Select Vendor</label>
                    <select class="form-control" id="vendor" name="vendor" required>
                        <option value="">Select a vendor</option>
                        {% for vendor in vendors %}
                        <option value="{{ vendor.id }}">{{ vendor.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="total_payment">Total Payment Amount (₹)</label>
                    <input type="number" class="form-control" id="total_payment" name="total_payment" step="0.01" min="0" required>
                </div>

                <div class="form-group mb-3">
                    <label for="payment_mode">Payment Mode</label>
                    <select class="form-control" id="payment_mode" name="payment_mode" required>
                        <option value="cash">Cash</option>
                        <option value="account_pay">Account Pay</option>
                        <option value="upi">UPI GPay / PhonePay</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Process Payment</button>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('vendor').addEventListener('change', function() {
    if (this.value) {
        // You could add AJAX here to fetch and display unpaid invoices
        // for the selected vendor
    }
});
</script>
{% endblock %}
